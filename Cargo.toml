[package]
name = "ifrit"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }
axum = "0.8.1"
sqlx = { version = "0.8.3", features = [
  "runtime-tokio-rustls",
  "postgres",
  "macros",
  "time",
] }
tower-http = { version = "0.6.2", features = ["full"] }
